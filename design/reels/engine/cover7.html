<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:JBM;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
html,body{margin:0}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:#111317;color:#F4F1EA;font-family:Inter}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% 55%,rgba(255,255,255,.09),rgba(255,255,255,0) 70%)}
.mono{font-family:JBM;font-weight:700;text-transform:uppercase;letter-spacing:3px}
.anton{font-family:Anton;line-height:.92}
.c{position:absolute;left:0;right:0;text-align:center}
</style></head><body><div id="stage"><div class="spot"></div>
<div class="c mono" style="top:330px;font-size:28px;color:#8A9099">Australia’s housing promise</div>
<div class="c anton" style="top:395px;font-size:196px;color:#FF6B1A">1.2M HOMES</div>
<div class="c anton" style="top:620px;font-size:120px;color:#F4F1EA">NOT ENOUGH TRADIES</div>
<div id="g" style="position:absolute;left:150px;top:820px;width:780px;height:620px"></div>
<div class="c mono" style="top:1480px;font-size:28px;color:#C9C4B8"><span style="color:#FF6B1A">26% built</span> · 35% of the time gone</div>
</div><script>
const house=(w,fill,stroke,win)=>`<svg viewBox="0 0 100 90" width="${w}" height="${w*0.9}"><path d="M50 4 L96 42 H86 V86 H14 V42 H4 Z" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/><rect x="42" y="58" width="16" height="28" fill="${win}"/><rect x="22" y="50" width="14" height="12" fill="${win}"/><rect x="64" y="50" width="14" height="12" fill="${win}"/></svg>`;
let h='';for(let r=0;r<5;r++)for(let c=0;c<6;c++){const i=r*6+c,on=i<8;
h+=`<div style="position:absolute;left:${c*135}px;top:${r*125}px">${house(110,on?'#FF6B1A':'#2A2D33',on?'#0E0F12':'#4A4F57',on?'#7A2E0C':'#1A1C20')}</div>`;}
document.getElementById('g').innerHTML=h;
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:JBM;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
body{margin:0}#c{width:1080px;height:1920px;background:#F4F1EA;position:relative;overflow:hidden;font-family:Inter;color:#16181D}
.stripe{position:absolute;left:0;right:0;height:36px;background:repeating-linear-gradient(45deg,#16181D 0 26px,#FF6B1A 26px 52px)}
.a{font-family:Anton;line-height:.92;text-align:center;position:absolute;left:0;right:0}
.m{font-family:JBM;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-align:center;position:absolute;left:0;right:0}
.card{position:absolute;width:390px;top:830px;text-align:center;background:#fff;border:6px solid #16181D;border-radius:24px;box-shadow:12px 12px 0 #16181D;padding:36px 0}
</style></head><body><div id="c">
<div class="stripe" style="top:0"></div>
<div class="m" style="top:340px;font-size:32px;color:#5B616A">One hour of a sparky’s time</div>
<div class="a" style="top:420px;font-size:160px;white-space:nowrap">YOU EARN $32.</div>
<div class="a" style="top:580px;font-size:160px;color:#FF6B1A;white-space:nowrap">THEY BILL $115.</div>
<div class="card" style="left:120px;background:#FF6B1A"><div class="m" style="position:static;font-size:26px">Customer pays</div><div style="font-family:Anton;font-size:150px">$115</div></div>
<div class="card" style="left:570px"><div class="m" style="position:static;font-size:26px">Award pays</div><div style="font-family:Anton;font-size:150px">$32</div></div>
<div class="a" style="top:1230px;font-size:110px">WHERE’S THE REST?</div>
<div class="m" style="top:1390px;font-size:28px;color:#5B616A">Why tradies start their own business</div>
<div class="stripe" style="bottom:0"></div>
</div></body></html>

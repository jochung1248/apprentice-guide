<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stat card template</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8FA8FF}a:hover{color:#F4F1EA}
</style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; background: #16181D; color: #F4F1EA; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 84px; display: flex; flex-direction: column; justify-content: space-between">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #8FA8FF">WOMEN IN TRADES</div>
      <div style="width: 64px; height: 64px; border-radius: 10px; background: #FF6B1A; color: #16181D; display: flex; align-items: center; justify-content: center; font-family: Anton, sans-serif; font-size: 32px">TN</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 28px">
      <div style="font-family: Anton, sans-serif; font-size: 380px; line-height: 0.82; color: #FF6B1A">~3%</div>
      <div style="font-size: 52px; font-weight: 800; line-height: 1.15">of construction tradespeople are women.</div>
      <div style="font-size: 36px; font-weight: 600; line-height: 1.3; color: #C9C5BC">Getting more women in could add around 51,000 workers.</div>
    </div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 1.5px; color: #A3A7AE">SOURCES: MASTER BUILDERS / NAWIC · BUILDSKILLS AUSTRALIA 2025</div>
  </div>
  <div style="height: 32px; background: repeating-linear-gradient(45deg, #FF6B1A 0 22px, #16181D 22px 44px)" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

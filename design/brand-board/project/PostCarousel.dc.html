<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel cover template</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#16181D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #F4F1EA; color: #16181D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="height: 40px; background: repeating-linear-gradient(45deg, #16181D 0 28px, #FF6B1A 28px 56px)" aria-hidden="true"></div>
  <div style="flex: 1; padding: 80px 84px 72px; display: flex; flex-direction: column; justify-content: space-between">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 18px">
        <div style="width: 72px; height: 72px; border-radius: 12px; background: #16181D; color: #FF6B1A; display: flex; align-items: center; justify-content: center; font-family: Anton, sans-serif; font-size: 36px">TN</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; letter-spacing: 1.5px">TRADIE NUMBERS</div>
      </div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: #5B616A">1/7</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 36px">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; letter-spacing: 2px; color: #C2410C">MYTH VS FACT · TRADES EDITION</div>
      <h2 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 150px; line-height: 0.92; text-transform: uppercase">4 things people <span style="background: linear-gradient(transparent 58%, #FFE14D 58%, #FFE14D 92%, transparent 92%)">get wrong</span> about trades</h2>
      <p style="margin: 0; font-size: 38px; font-weight: 600; line-height: 1.3; color: #3A3F47">With the numbers to back it up.</p>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: 1.5px; color: #5B616A">SOURCES ON THE LAST SLIDE</div>
      <div style="display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800">Swipe
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
